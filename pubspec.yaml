name: sms_otp_app
description: SMS OTP Gateway – receives OTP requests from backend and sends SMS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  telephony: ^0.2.0
  shared_preferences: ^2.3.2
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
