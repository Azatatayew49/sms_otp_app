name: sms_otp_app
description: SMS OTP Gateway – receives OTP requests from backend and sends SMS.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  another_telephony: ^0.4.1
  shared_preferences: ^2.3.2
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.4
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
